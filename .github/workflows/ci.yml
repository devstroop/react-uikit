name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # prettier ships no binary in this repo yet (see .prettierrc);
      # pin the formatter via npx until the devDependency lands.
      - run: npx --yes prettier@3 --check .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
