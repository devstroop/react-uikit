name: Feature request
description: Propose a component, prop, or behavior addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you build today, and who is blocked?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: API sketch (props, variants). Link the Radzen equivalent if one exists.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds, other libraries, or doing nothing.
  - type: checkboxes
    id: parity
    attributes:
      label: Parity checklist
      options:
        - label: I checked whether Radzen has this and noted the mapping above
