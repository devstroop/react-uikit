name: Bug report
description: Report a reproducible defect in react-uikit
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw vs what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest snippet or showcase route that shows it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Tag or develop hash you tested against.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Browser + version, OS, light/dark, viewport if layout-related.
